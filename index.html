<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Car-shop</title>
  <link rel="icon" href="./assets/img/Vector.png">
  <link rel="stylesheet" href="./assets/css/Style.css">
  <link rel="stylesheet" href="./assets/css/Media.css">
</head>

<body>

  <!-- header -->

  <header>

    <!-- logo -->

    <div class="logo">

      <!-- img-Right -->

      <img class="shape-big" src="./assets/img/shape big.png" alt="#">
      <img class="logo-img" src="./assets/img/Logo.png" alt="#">

      <!-- img-mobil-Right -->

      <img class="shape-big-mobil" src="./assets/img/shape big-mobil.png" alt="">
    </div>

    <!-- menu -->

    <div class="hamburger">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>
    <ul class="header-links">
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Popular</a></li>
      <li><a class="header-cat-button" href="#Featured">Featured</a></li>
    </ul>
  </header>

  <!-- main -->
  <main>

    <div class="hero-content">
      <h1 class="hero-title">Choose The Best Car</h1>
      <p class="hero-subtitle">Porsche Mission E</p>
      <div class="car-info">
        <img src="./assets/svg/Vector.svg" alt="icon" class="car-icon">
        <p class="car-type">Electric car</p>
      </div>
      <img src="./assets/img/home 1.png" alt="#">
    </div>

    <!-- items -->

    <div class="items">

      <!-- item -->

      <div class="item">
        <img src="./assets/svg/Vector1.svg" alt="icon">
        <h1>24°</h1>
        <p>TEMPERATURE</p>
      </div>

      <!-- item -->

      <div class="item">
        <img src="./assets/svg/Km.svg" alt="icon">
        <h1>873</h1>
        <p>MILEAGE</p>
      </div>

      <!-- item -->

      <div class="item">
        <img src="./assets/svg/Vector2.svg" alt="icon">
        <h1>94%</h1>
        <p>BATTERY</p>
      </div>
    </div>

    <!-- img Left -->

    <img class="shape-small" src="/assets/img/shape small.png" alt="#">

    <!-- img-mobil-Left -->

    <img class="shape-small-mobil" src="/assets/img/shape small mobil.png" alt="#">

    <!-- image-container -->

    <div class="image-container">
      <img src="./assets/svg/Ellipse 4.svg" alt="icon" class="image1">
      <img src="./assets/svg/Ellipse 5.svg" alt="icon" class="image2">
      <p class="start-text">START</p>
    </div>

  </main>


</body>

<Script src="./assets/js/APP.js"></Script>

</html>
